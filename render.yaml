services:
  - type: web
    name: 3d-scan
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      # سر مشترك بين الخادم والوكيل على كمبيوترك — أنشئ قيمة عشوائية طويلة
      # وضعها هنا في Render وفي إعداد الوكيل. لا يُحفظ في الكود أبدًا.
      - key: AGENT_TOKEN
        generateValue: true
